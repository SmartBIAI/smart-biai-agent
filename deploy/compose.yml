name: smart-biai-agent
services:
  agent:
    image: smart-biai-agent:0.2.2-docker.1
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      BIAI_HOST: 0.0.0.0
      PORT: '4173'
      BIAI_DATA_DIR: /data
      BIAI_REQUIRE_AUTH: 'true'
      BIAI_BASE_PATH: ${BIAI_BASE_PATH:-/smart-biai-agent}
    ports:
      - '127.0.0.1:${BIAI_BIND_PORT:-4178}:4173'
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
